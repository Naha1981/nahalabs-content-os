[project]
name = "nahalabs-content-os-backend"
version = "0.1.0"
description = "Production backend foundation for NahaLabs Content OS"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "mangum>=0.19,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=5.2,<6",
  "boto3>=1.35,<2",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "zernio-sdk>=0.1.0",
  "python-multipart>=0.0.17,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["app"]
