services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nahalabs_content_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["contentos_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: "true"
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  contentos_pg:
