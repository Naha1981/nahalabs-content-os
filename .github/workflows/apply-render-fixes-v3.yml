name: Apply Reactivate Render fixes v3

on:
  push:
    paths:
      - '.github/workflows/apply-render-fixes-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[render-fixes-v3]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run source migration
        run: python scripts/apply_render_fixes.py

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak
          python -m pip install -r backend/requirements.txt
          python -m playwright install chromium
          cd frontend
          npm install

      - name: Verify backend and frontend
        run: |
          python -m compileall backend
          pytest -q
          cd frontend
          npm ci
          npm run build
          if grep -Rq '/api/api' dist/assets/*.js; then
            echo 'Regression: /api/api double prefix remains in the production bundle'
            exit 1
          fi

      - name: Commit and push migration
        run: |
          git config user.name 'NahaLabs Render Fix Bot'
          git config user.email 'dev@nahalabs.local'
          git add -A
          git commit -m 'Apply Reactivate production Render fixes [render-fixes-v3]'
          git push origin HEAD:main
