name: NahaLabs Reactivate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install system media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

  smoke:
    name: Full stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Start backend
        run: |
          nohup uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 >/tmp/reactivate-backend.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/reactivate-frontend.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5173 >/dev/null
      - name: Verify exact legacy API request path
        run: |
          response=$(curl -fsS -o /tmp/prospects.json -w '%{http_code}' 'http://127.0.0.1:5173/api/api/v1/prospects?limit=1')
          test "$response" = "200"
          python - <<'PY'
          import json
          with open('/tmp/prospects.json', encoding='utf-8') as f:
              data = json.load(f)
          assert 'prospects' in data, data
          print('Legacy API path smoke test passed')
          PY
      - name: Dump server logs on failure
        if: failure()
        run: |
          echo '--- backend ---'
          cat /tmp/reactivate-backend.log || true
          echo '--- frontend ---'
          cat /tmp/reactivate-frontend.log || true
