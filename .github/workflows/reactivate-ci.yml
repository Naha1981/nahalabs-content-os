name: NahaLabs Reactivate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install system media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Assert the legacy double API prefix is gone
        run: |
          if grep -Rq '/api/api' dist/assets/*.js; then
            echo 'Regression: /api/api double prefix is back in the production bundle'
            exit 1
          fi
          echo 'No /api/api double prefix found'

  smoke:
    name: Full stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Start backend
        env:
          PORT: '8000'
        run: |
          nohup uvicorn backend.app.main:app --host 127.0.0.1 --port "$PORT" >/tmp/reactivate-backend.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health > /tmp/health.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/health.json', encoding='utf-8'))
          assert data['status'] == 'ok', data
          assert data['version'], data
          assert 'browser_worker' in data, data
          print('Health OK:', data['version'])
          PY
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5175 >/tmp/reactivate-frontend.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:5175 >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5175 >/dev/null
      - name: Verify canonical API request path through dev proxy
        run: |
          code=$(curl -fsS -o /tmp/prospects.json -w '%{http_code}' 'http://127.0.0.1:5175/api/v1/prospects?limit=1')
          test "$code" = '200'
          python - <<'PY'
          import json
          data = json.load(open('/tmp/prospects.json', encoding='utf-8'))
          assert 'prospects' in data, data
          print('Canonical API path smoke test passed')
          PY
      - name: Verify outreach queue route specificity
        run: |
          code=$(curl -fsS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8000/api/v1/prospects/outreach-queue')
          test "$code" = '200'
          echo 'Outreach queue route resolves correctly'
      - name: Dump server logs on failure
        if: failure()
        run: |
          echo '--- backend ---'
          cat /tmp/reactivate-backend.log || true
          echo '--- frontend ---'
          cat /tmp/reactivate-frontend.log || true
